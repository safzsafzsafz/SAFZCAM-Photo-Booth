<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SAFZCAM</title>
<meta name="description" content="SAFZCAM Photo Booth — Make it a moment.">
<meta property="og:type" content="website">
<meta property="og:title" content="SAFZCAM Photo Booth">
<meta property="og:description" content="Take photos, choose your mood, and keep the memory.">
<meta property="og:image" content="https://safz.com/preview.png">
<meta property="og:url" content="https://safz.com/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://safz.com/preview.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--curtain:#7a1f2b;--curtain2:#661923;--paper:#fff;--ink:#3a1f28;--gold:#fff;--panel:#f7c6d3;--text:#3a1f28;--chrome:#c9c2b3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background-color:#fff;background-image:radial-gradient(circle,#000 0 9px,transparent 10px),radial-gradient(circle,#000 0 9px,transparent 10px);background-size:48px 48px;background-position:0 0,24px 24px;color:var(--text);font-family:"Courier Prime",ui-monospace,Menlo,monospace;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding:1.5rem 1rem 3rem;display:grid;gap:1.5rem;grid-template-columns:minmax(0,1fr)}
@media(min-width:820px){.wrap{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}header{grid-column:1/-1}}
h1{font:400 clamp(2.4rem,8vw,4rem)/1 Shrikhand,Georgia,serif;margin:0;color:#fff;background:#000;display:inline-block;padding:.1em .35em;border-radius:12px;box-shadow:5px 5px 0 #fff,5px 5px 0 2px #000}
header p{margin:.9rem 0 0;font-size:1.05rem;color:#000;background:#fff;display:inline-block;padding:.3rem .7rem;border:2px solid #000;border-radius:8px}
.panel{background:var(--panel);border:8px solid var(--chrome);border-radius:14px;padding:1rem;box-shadow:0 0 0 3px #7d776b,0 12px 28px rgba(0,0,0,.3)}
.vf{position:relative;aspect-ratio:4/3;background:#000;overflow:hidden;border-radius:6px}
.vf video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.vf[data-f=sepia] video{filter:sepia(.85) contrast(1.1) brightness(1.05)}
.vf[data-f=faded] video{filter:sepia(.3) saturate(.7) contrast(.85) brightness(1.12)}
.vf[data-f=mono] video{filter:grayscale(1) contrast(.98) brightness(1.06)}
.vf[data-f=grad] video{filter:saturate(1.1) contrast(1.05) brightness(1.08)}
.vf[data-f=grad]::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;mix-blend-mode:soft-light;background:linear-gradient(160deg,#ff7eb3 0%,#ffc2d9 40%,#b79cff 100%);opacity:.85}
.vf[data-f=blue]::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;mix-blend-mode:exclusion;opacity:.45;background:radial-gradient(ellipse 62% 62% at 50% 50%,#5b6efc 0%,#4a5af0 25%,#2438e0 50%,#0a1fb8 68%,#030a60 85%,#01021e 100%)}
.vf[data-f=blue]::after{background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,10,.6))}
.vf[data-f=natural] video{filter:brightness(1.08) contrast(.97) saturate(1.08)}
.vf[data-f=sunset]::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;mix-blend-mode:screen;opacity:.67;background:linear-gradient(172deg,#3f3f96 0%,#6a2d80 35%,#8f2862 65%,#a0502d 100%)}
.stk i.d{width:1.1%;border-radius:50%;background:#ff4db8;clip-path:none}
.curtain{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden}
.curtain i{position:absolute;top:0;bottom:0;width:50.6%;transition:transform 1.8s cubic-bezier(.65,0,.3,1);
background:linear-gradient(90deg,rgba(0,0,0,.12),transparent 12%,transparent 88%,rgba(0,0,0,.12)),repeating-linear-gradient(90deg,#fff 0 14px,#f7c6d3 14px 26px,#dedede 26px 36px,#f7c6d3 36px 46px,#fff 46px 58px);box-shadow:0 0 14px rgba(0,0,0,.3)}
.curtain .cl{left:0;transform-origin:left center}
.curtain .cr{right:0;transform-origin:right center}
.curtain[data-open=true] i{transform:scaleX(.12)}
.vf:has(.curtain[data-open=false]) .cue{color:#3a1f28;text-shadow:0 1px 0 #fff,0 0 8px #fff}
.curtain .val{position:absolute;left:0;right:0;top:0;height:11%;z-index:2;background:linear-gradient(#ffd9e3,#f2b3c6);border-bottom:4px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.3)}
@media(prefers-reduced-motion:reduce){.curtain i{transition-duration:.01s}}
.glit{position:absolute;inset:0;z-index:2;pointer-events:none}
.glit i.cs{border-radius:0;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.glit i{position:absolute;border-radius:50%;aspect-ratio:1;transform:translate(-50%,-50%)}
.stk{position:absolute;inset:0;z-index:2;pointer-events:none}
.stk i{position:absolute;width:2.6%;aspect-ratio:1;background:#ee5fba;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);transform:translate(-50%,-50%)}
.vf::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55));pointer-events:none}
.cue{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:1rem;z-index:6;text-shadow:0 2px 6px #000;color:var(--paper);font-size:1.1rem;text-shadow:0 2px 6px #000}
.cue.big{font:400 clamp(5rem,22vw,9rem)/1 Shrikhand,Georgia,serif}
.flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:3;pointer-events:none}
.flash.go{animation:fl .5s ease-out}
@keyframes fl{from{opacity:.95}to{opacity:0}}
.row3{display:flex;flex-wrap:nowrap;gap:.5rem;margin-top:.6rem}
.row3>button,.row3>label{flex:1 1 0;min-width:0;text-align:center;padding:.75rem .4rem;font-size:clamp(.72rem,2.9vw,1rem);white-space:nowrap}
.sub{font-size:.9rem;margin:.9rem 0 0;font-weight:700}
.bar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-top:.9rem}
.lamp{display:flex;align-items:center;gap:.5rem;margin-right:auto;font-size:.95rem}
.lamp i{width:14px;height:14px;border-radius:50%;background:#5bd16b;box-shadow:0 0 10px #5bd16b}
.lamp[data-s=shoot] i{background:#ff4a3d;box-shadow:0 0 10px #ff4a3d}
.lamp[data-s=off] i{background:#6b5d55;box-shadow:none}
button,.btn{font:700 1rem "Courier Prime",monospace;background:var(--gold);color:var(--ink);border:0;border-radius:999px;padding:.75rem 1.4rem;cursor:pointer;display:inline-block}
button:disabled{opacity:.5;cursor:default}
.chip,.opt,.tog{background:transparent;color:var(--text);border:2px solid var(--chrome);padding:.4rem .9rem}
.chip[aria-pressed=true],.opt[aria-pressed=true],.tog[aria-pressed=true]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.ghost{background:transparent;color:var(--text);border:2px solid var(--gold)}
:is(button,.btn,input):focus-visible,label:focus-within{outline:3px solid #3a1f28;outline-offset:2px}
#msg{margin:.8rem 0 0;font-size:.95rem}
.slit{height:16px;background:#e79ab0;border-radius:8px;border-bottom:3px solid var(--gold);margin-bottom:.6rem}
.drawer{overflow:hidden}
.box{width:min(100%,300px);margin:0 auto}
.box canvas,.box img{display:block;width:100%;height:auto;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.box.drop{animation:drop 1.3s cubic-bezier(.2,.8,.3,1)}
@keyframes drop{from{transform:translateY(-100%)}to{transform:none}}
@media(prefers-reduced-motion:reduce){.box.drop,.flash.go{animation:none}}
.done{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-top:1rem}
.hint{text-align:center;font-size:.9rem;margin:.8rem 0 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>SAFZCAM</h1>
<p>Four frames, one strip. Pick a film look, then smile.</p>
</header>

<section class="panel" aria-label="Camera">
<div class="vf" id="vf" data-f="sepia">
<video id="vid" playsinline muted></video>
<div class="cue" id="cue">Step inside and start the camera.</div>
<div class="stk" id="stkLayer" hidden></div>
<div class="stk" id="polkaLayer" hidden></div>
<div class="glit" id="glitLayer" hidden></div>
<div class="glit" id="cstarLayer" hidden></div>
<div class="curtain" id="curtain" data-open="false"><i class="cl"></i><i class="cr"></i><b class="val"></b></div>
<div class="flash" id="fl"></div>
</div>
<div class="bar">
<div class="lamp" id="lamp" data-s="off"><i></i><span id="lampT">Curtain closed</span></div>
</div>
<div class="row3">
<button id="go">Start camera</button>
<button id="flip" class="ghost" hidden>Flip camera</button>
<label class="btn ghost" id="upl" style="cursor:pointer">Upload photo<input type="file" id="uplIn" accept="image/*" multiple hidden></label>
<label class="btn" id="pick" hidden>Add photo 1 of 4<input type="file" accept="image/*" capture="user" hidden></label>
</div>
<p id="msg" role="status"></p>
<div class="bar">
<button class="chip" data-f="sepia" aria-pressed="true">Sepia</button>
<button class="chip" data-f="faded" aria-pressed="false">Faded color</button>
<button class="chip" data-f="mono" aria-pressed="false">Black and white</button>
<button class="chip" data-f="grad" aria-pressed="false">Gradient glow</button>
<button class="chip" data-f="blue" aria-pressed="false">Voluxe Haze</button>
<button class="chip" data-f="sunset" aria-pressed="false">Sunset Gradient</button>
<button class="chip" data-f="natural" aria-pressed="false">Natural Glow</button>
</div>
<div class="bar"><span>Stickers</span><button class="tog" id="stk" aria-pressed="false">Star stickers</button><button class="tog" id="polka" aria-pressed="false">Polka stickers</button><button class="tog" id="glit" aria-pressed="false">Glitter Splatter</button><button class="tog" id="cstar" aria-pressed="false">Colorful Star Stickers</button></div>
<p class="sub" style="margin-bottom:-.3rem">Photo strip options</p>
<div class="bar" id="optN" role="group" aria-label="Number of photos"><span>Photos</span>
<button class="opt" data-n="2" aria-pressed="false">2</button><button class="opt" id="n3" data-n="3" aria-pressed="false">3 (strip only)</button><button class="opt" data-n="4" aria-pressed="true">4</button><button class="opt" id="n6" data-n="6" aria-pressed="false" hidden>6 (grid only)</button></div>
<div class="bar" id="optL" role="group" aria-label="Layout"><span>Layout</span>
<button class="opt" data-l="strip" aria-pressed="true">Vertical strip</button><button class="opt" data-l="grid" aria-pressed="false">Grid</button></div>
<div class="bar" id="optP" role="group" aria-label="Paper style"><span>Paper</span>
<button class="opt" data-p="dots" aria-pressed="true">Black dots</button><button class="opt" data-p="pinkygray" aria-pressed="false">Pinky Gray stripe</button><button class="opt" data-p="whimsy" aria-pressed="false">Whimsical Polka</button><button class="opt" data-p="stars" aria-pressed="false">Whimsical Stripe Star</button><button class="opt" data-p="white" aria-pressed="false">Plain white</button></div>
</section>

<section class="panel" aria-label="Your photo strip">
<div class="slit"></div>
<div class="drawer"><div class="box" id="box">
<canvas id="strip"></canvas>
<img id="out" alt="Your finished photo strip" hidden>
</div></div>
<div class="done" id="done" hidden>
<button id="save">Save strip</button>
<button id="new" class="ghost">New strip</button>
</div>
<p class="hint" id="saveHint" hidden>Press and hold the strip to save it.</p>
</section>
</div>

let W=480,H=360;const M=30;
let N=4,layout='strip',paper='dots',cols=1,rows=4,SW=W+2*M,P=0,SH=0;

const strip=$('#strip'),sx=strip.getContext('2d'),out=$('#out'),vid=$('#vid'),vf=$('#vf'),cue=$('#cue'),
  go=$('#go'),msg=$('#msg'),fl=$('#fl'),box=$('#box'),done=$('#done'),pick=$('#pick');
const STARS=[[23,43],[438,102],[728,160],[83,339],[320,458],[23,517],[616,517],[379,635],[728,752],[142,872],[497,872],[23,1110],[497,1110]];
let stickers=false;
const CSC=[['#ec8fa8','#c4607c'],['#3fa23c','#217a22'],['#dcdc3a','#a9a91c'],['#f29d2c','#c9741a'],['#dc3b20','#a62410'],['#3283c4','#1c5c93']];
function genCS(){const out=[],n=11+((Math.random()*4)|0);
  for(let t=0;t<400&&out.length<n;t++){const u=.05+Math.random()*.9,v=.05+Math.random()*.9;
    if(out.every(o=>Math.hypot((o.u-u)*W,(o.v-v)*H)>W*.1))out.push({u,v,rot:(Math.random()-.5)*70,s:.85+Math.random()*.35,c:CSC[(Math.random()*CSC.length)|0],sp:[0,1,2,3].map(()=>[Math.random()*1.0-.5,Math.random()*1.0-.5])})}
  return out}
let csset=genCS(),csOn=false;
function addCS(c){for(const g of csset){const x=g.u*W,y=g.v*H,R=W*.03*g.s,rot=g.rot*Math.PI/180;
  c.save();c.translate(x,y);c.rotate(rot);
  c.beginPath();for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,rr=k%2?R*.5:R;c[k?'lineTo':'moveTo'](rr*Math.cos(a),rr*Math.sin(a))}c.closePath();
  const gr=c.createRadialGradient(-R*.3,-R*.3,R*.1,0,0,R);gr.addColorStop(0,g.c[0]);gr.addColorStop(1,g.c[1]);
  c.fillStyle=gr;c.strokeStyle=g.c[1];c.lineWidth=R*.18;c.lineJoin='round';c.stroke();c.fill();
  c.fillStyle='rgba(255,255,255,.7)';g.sp.forEach(([a,b])=>{c.beginPath();c.arc(a*R*.8,b*R*.8,R*.09,0,6.2832);c.fill()});
  c.restore()}}
function updateCS(){$('#cstarLayer').innerHTML=csset.map(g=>'<i class="cs" style="left:'+(g.u*100)+'%;top:'+(g.v*100)+'%;width:'+(6*g.s)+'%;transform:translate(-50%,-50%) rotate('+g.rot+'deg);background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.75) 0 7%,transparent 8%),radial-gradient(circle at 62% 58%,rgba(255,255,255,.6) 0 6%,transparent 7%),radial-gradient(circle at 35% 30%,'+g.c[0]+',' +g.c[1]+')"></i>').join('')}
$('#cstar').onclick=e=>{csOn=!csOn;e.currentTarget.setAttribute('aria-pressed',csOn);$('#cstarLayer').hidden=!csOn;updateCS()};

const GC=[['#f0be55','#b8832a'],['#e2a944','#a9772a'],['#b0706a','#7c4a49'],['#9a6262','#6d4141'],['#86ad9d','#587f70']];
function genGlit(){const n=48+((Math.random()*16)|0);return Array.from({length:n},()=>({u:.02+Math.random()*.96,v:.02+Math.random()*.96,s:.7+Math.random()*.6,c:GC[(Math.random()*GC.length)|0]}))}
let gset=genGlit(),glitOn=false;
function addGlit(c){for(const g of gset){const x=g.u*W,y=g.v*H,r=W*.0065*g.s,gr=c.createRadialGradient(x-r*.35,y-r*.35,r*.1,x,y,r);
  gr.addColorStop(0,'rgba(255,255,255,.85)');gr.addColorStop(.35,g.c[0]);gr.addColorStop(1,g.c[1]);c.fillStyle=gr;c.beginPath();c.arc(x,y,r,0,6.2832);c.fill()}}
function updateGlit(){$('#glitLayer').innerHTML=gset.map(g=>'<i style="left:'+(g.u*100)+'%;top:'+(g.v*100)+'%;width:'+(1.3*g.s)+'%;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.85),'+g.c[0]+' 35%,'+g.c[1]+' 100%)"></i>').join('')}
$('#glit').onclick=e=>{glitOn=!glitOn;e.currentTarget.setAttribute('aria-pressed',glitOn);$('#glitLayer').hidden=!glitOn;updateGlit()};

let polkaOn=false;
function dotPts(){const out=[],cs=.18*W,rs=.09*W;for(let r=0,y=.042*W;y<H+rs;y+=rs,r++)for(let x=.053*W+(r%2)*rs;x<W+cs;x+=cs)out.push([x,y]);return out}
function addDots(c){c.save();c.fillStyle='#ff4db8';dotPts().forEach(([x,y])=>{c.beginPath();c.arc(x,y,W*.0055,0,6.2832);c.fill()});c.restore()}
function updatePolka(){$('#polkaLayer').innerHTML=dotPts().map(([x,y])=>'<i class="d" style="left:'+(x/W*100)+'%;top:'+(y/H*100)+'%"></i>').join('')}
$('#polka').onclick=e=>{polkaOn=!polkaOn;e.currentTarget.setAttribute('aria-pressed',polkaOn);$('#polkaLayer').hidden=!polkaOn;updatePolka()};

function starFill(c,cx,cy,R){c.beginPath();for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,rr=k%2?R*.45:R;c[k?'lineTo':'moveTo'](cx+rr*Math.cos(a),cy+rr*Math.sin(a))}c.closePath();c.fill()}
function sp(x,y,v){return [(v&1?736-x:x)/736,(v&2?1308-y:y)/1308]}
function addStars(c,v){c.save();c.fillStyle='#ee5fba';STARS.forEach(([x,y])=>{const [u,w]=sp(x,y,v);starFill(c,u*W,w*H,W*.026)});c.restore()}
function updateLayer(){const v=idx%4;$('#stkLayer').innerHTML=STARS.map(([x,y])=>{const [u,w]=sp(x,y,v);return '<i style="left:'+(u*100)+'%;top:'+(w*100)+'%"></i>'}).join('')}
$('#stk').onclick=e=>{stickers=!stickers;e.currentTarget.setAttribute('aria-pressed',stickers);$('#stkLayer').hidden=!stickers;updateLayer()};
let noiseOn=true;
let filter='sepia',idx=0,busy=false,stream=null,dl=null;
geo();base();

function star(cx,cy,R){sx.beginPath();for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,rr=k%2?R*.45:R;sx[k?'lineTo':'moveTo'](cx+rr*Math.cos(a),cy+rr*Math.sin(a))}sx.closePath();sx.fill()}
function base(){sx.clearRect(0,0,SW,SH);sx.fillStyle='#f7c6d3';sx.fillRect(0,P,SW,SH-P);sx.save();sx.beginPath();sx.rect(0,0,SW,P);sx.clip();
  sx.fillStyle=paper==='whimsy'?'#352f3f':'#fff';sx.fillRect(0,0,SW,P);
  if(paper==='whimsy'){const T=Math.round(P*.53);sx.fillStyle='#fcbec3';
    for(let y=T+20,r=0;y<P+20;y+=31,r++)for(let x=(r%2)*32+22;x<SW+30;x+=64)star(x,y,8.5);
    if(swirl.complete&&swirl.naturalWidth){const k=Math.max(SW/swirl.naturalWidth,T/swirl.naturalHeight),w=swirl.naturalWidth*k,h=swirl.naturalHeight*k;sx.save();sx.beginPath();sx.rect(0,0,SW,T);sx.clip();sx.drawImage(swirl,(SW-w)/2,0,w,h);sx.restore()}
    else{sx.fillStyle='#e0709a';sx.fillRect(0,0,SW,T)}}
  if(paper==='pinkygray'){sx.fillStyle='#fadbe1';sx.fillRect(0,0,SW,P);sx.fillStyle='#b6b6b6';for(let y=0;y<P;y+=56)sx.fillRect(0,y,SW,28)}
  if(paper==='stars'){sx.fillStyle='#fbf9c4';sx.fillRect(0,0,SW,P);sx.fillStyle='#d0f0fb';
    for(let x=26;x<SW;x+=60)sx.fillRect(x,0,34,P);
    let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647,cols=['#ff6f9f','#ffb6d0','#6fdcff'];
    for(let k=0,n=Math.round(SW*P/5200);k<n;k++){sx.fillStyle=cols[k%3];star(rnd()*SW,rnd()*P,7+rnd()*3)}}
  if(paper==='dots'){sx.fillStyle='#000';
    for(let y=0,r=0;y<P+12;y+=14,r++)for(let x=(r%2)*7;x<SW+12;x+=14){sx.beginPath();sx.arc(x,y,2.2,0,6.2832);sx.fill()}}
  sx.restore();
  for(let i=0;i<N;i++){const [px,py]=pos(i);sx.fillStyle=paper==='whimsy'?'#241f2d':(paper==='pinkygray'||paper==='stars')?'#fff':'#f3d3dc';sx.fillRect(px,py,W,H)}}
let box0=0;
function state(s,t){$('#lamp').dataset.s=s;$('#lampT').textContent=t}
function flash(){fl.classList.remove('go');void fl.offsetWidth;fl.classList.add('go')}

document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
  if(busy)return;filter=b.dataset.f;vf.dataset.f=filter;
  document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===b))});

function smooth(p){
  if(filter==='natural')return;
  const R=4,n=W*H,t=new Float32Array(n*3),bl=new Float32Array(n*3);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){for(let c=0;c<3;c++){let a=0,k=0;for(let d=-R;d<=R;d++){const xx=x+d;if(xx>=0&&xx<W){a+=p[(y*W+xx)*4+c];k++}}t[(y*W+x)*3+c]=a/k}}
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){for(let c=0;c<3;c++){let a=0,k=0;for(let d=-R;d<=R;d++){const yy=y+d;if(yy>=0&&yy<H){a+=t[(yy*W+x)*3+c];k++}}bl[(y*W+x)*3+c]=a/k}}
  for(let q=0;q<n;q++){const i=q*4,r=p[i],g=p[i+1],b=p[i+2],l=.3*r+.59*g+.11*b;
    const sk=(r>g&&g>b*.95&&r-b>14&&r-g<70&&l>70)?Math.min(1,(r-b-14)/30)*Math.min(1,(l-70)/50):0;
    if(!sk)continue;
    const br=bl[q*3],bg=bl[q*3+1],bb=bl[q*3+2],bll=.3*br+.59*bg+.11*bb,e=Math.abs(l-bll),
      m=.7*sk*Math.max(0,1-e/22);
    p[i]=r+(br-r)*m;p[i+1]=g+(bg-g)*m;p[i+2]=b+(bb-b)*m}}
const HZS=[[0,[91,110,252]],[.25,[74,90,240]],[.5,[36,56,224]],[.68,[10,31,184]],[.85,[3,10,96]],[1,[1,2,30]]];
function HZ(t){for(let k=1;k<HZS.length;k++){if(t<=HZS[k][0]){const a=HZS[k-1],b=HZS[k],u=(t-a[0])/(b[0]-a[0]);return [0,1,2].map(c=>a[1][c]+(b[1][c]-a[1][c])*u)}}return HZS[5][1]}
let q0=0;
const SUN=[[0,[63,63,150]],[.35,[106,45,128]],[.65,[143,40,98]],[1,[160,80,45]]];
function sunAt(t){t=Math.max(0,Math.min(1,t));for(let k=1;k<SUN.length;k++){if(t<=SUN[k][0]){const a=SUN[k-1],b=SUN[k],u=(t-a[0])/(b[0]-a[0]);return [0,1,2].map(c=>a[1][c]+(b[1][c]-a[1][c])*u)}}return SUN[3][1]}
function retro(p){
  for(let i=0;i<p.length;i+=4){
    let r=p[i],g=p[i+1],b=p[i+2];const l=.3*r+.59*g+.11*b;
    if(filter==='mono'){r=g=b=((l-128)*1.0+128)*.92+14}
    else if(filter==='sepia'){r=l*1.07+18;g=l*.92+8;b=l*.72}
    else if(filter==='grad'){const t=(((q0=i>>2)/W|0)/H)*.6+(q0%W/W)*.4;const a=t<.5?[255,126,179,255,194,217]:[255,194,217,183,156,255],u=t<.5?t*2:(t-.5)*2;
      const gr=a[0]+(a[3]-a[0])*u,gg=a[1]+(a[4]-a[1])*u,gb=a[2]+(a[5]-a[2])*u;
      r=r*1.05+(gr-128)*.55;g=g*1.05+(gg-128)*.55;b=b*1.05+(gb-128)*.55}
    else if(filter==='natural'){
      const sk=(r>g&&g>b*.95&&r-b>14&&r-g<70&&.3*r+.59*g+.11*b>70)?Math.min(1,(r-b-14)/30)*Math.min(1,(.3*r+.59*g+.11*b-70)/50):0;
      r=r*1.05+8;g=g*1.05+7;b=b*1.04+7;
      const l3=.3*r+.59*g+.11*b;r=l3+(r-l3)*1.06;g=l3+(g-l3)*1.04;
      r+=8*sk;g+=4*sk;b+=sk}
    else if(filter==='sunset'){
      const q2=i>>2,t=(((q2/W)|0)/H)*.93+((q2%W)/W)*.07,c=sunAt(t),m=.67;
      r=r+((255-(255-r)*(255-c[0])/255)-r)*m;g=g+((255-(255-g)*(255-c[1])/255)-g)*m;b=b+((255-(255-b)*(255-c[2])/255)-b)*m}
    else if(filter==='blue'){
      const l2=.3*r+.59*g+.11*b,
        sk=(r>g&&g>b*.95&&r-b>14&&r-g<70&&l2>70)?Math.min(1,(r-b-14)/40)*Math.min(1,(l2-70)/60):0;
      r+=12*sk;g+=11*sk;b-=14*sk;
      const q3=i>>2,dx=((q3%W)/W-.5)/.62,dy=(((q3/W)|0)/H-.5)/.62,d=Math.min(1,Math.hypot(dx,dy)),
        c=HZ(d),m=.45;
      r=r+((r+c[0]-2*r*c[0]/255)-r)*m;g=g+((g+c[1]-2*g*c[1]/255)-g)*m;b=b+((b+c[2]-2*b*c[2]/255)-b)*m}
    else{r=r*.75+l*.25+38;g=g*.75+l*.25+26;b=b*.68+l*.25+14}
    const q=i>>2,dx=((q%W)-W/2)/(W/2),dy=(((q/W)|0)-H/2)/(H/2),v=1-(filter==='blue'?.5:filter==='natural'?.12:.34)*(dx*dx+dy*dy)/2*1.4,n=noiseOn?(Math.random()-.5)*10:0;
    p[i]=r*v+n;p[i+1]=g*v+n;p[i+2]=b*v+n}}

function shoot(src,sw,sh,mirror){
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d',{willReadFrequently:true}),k=Math.max(W/sw,H/sh);
  if(mirror){x.translate(W,0);x.scale(-1,1)}
  x.drawImage(src,(W-sw*k)/2,(H-sh*k)/2,sw*k,sh*k);
  const d=x.getImageData(0,0,W,H);smooth(d.data);retro(d.data);x.putImageData(d,0,0);
  if(polkaOn)addDots(x);
  if(glitOn){addGlit(x);gset=genGlit();updateGlit()}
  if(csOn){addCS(x);csset=genCS();updateCS()}
  if(stickers)addStars(x,idx%4);
  {const [px,py]=pos(idx);sx.drawImage(c,px,py);idx++;updateLayer()}}

function finish(){
  sx.fillStyle='#3a1f28';sx.textAlign='center';
  sx.font='700 24px "Courier Prime",monospace';sx.fillText('Photo Booth by SAFZCAM',SW/2,P+30);
  sx.font='400 18px "Courier Prime",monospace';
  sx.fillText(new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}),SW/2,P+56);
  out.src=strip.toDataURL('image/png');strip.hidden=true;out.hidden=false;
  box.classList.remove('drop');void box.offsetWidth;box.classList.add('drop');
  done.hidden=false;$('#saveHint').hidden=true;$('#save').hidden=false;
  busy=false;go.disabled=false;state('ready','Strip ready');msg.textContent='';}

async function run(){
  if(busy)return;busy=true;go.disabled=true;reset(true);
  for(let i=0;i<N;i++){
    state('shoot','Photo '+(i+1)+' of '+N);
    for(let n=i?2:3;n>0;n--){cue.className='cue big';cue.textContent=n;await sleep(800)}
    cue.className='cue';cue.textContent='';flash();
    shoot(vid,vid.videoWidth,vid.videoHeight,vid.dataset.mirror!=='false');await sleep(700)}
  finish()}

function reset(keepBusy){
  base();idx=0;updateLayer();strip.hidden=false;out.hidden=true;done.hidden=true;$('#saveHint').hidden=true;
  box.classList.remove('drop');
  if(!keepBusy){pick.firstChild.textContent='Add photo 1 of '+N;state(stream?'ready':'off',stream?'Ready':'Curtain closed')}}

let facing='user';
async function openCam(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  const tries=[{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:960}},true];
  for(const v of tries){
    try{stream=await navigator.mediaDevices.getUserMedia({video:v,audio:false});break}
    catch(e){stream=null;if(e.name==='NotAllowedError'||e.name==='SecurityError')throw e}}
  if(!stream)throw new Error('none');
  vid.srcObject=stream;await vid.play();
  const f=stream.getVideoTracks()[0].getSettings().facingMode;
  vid.style.transform=(f==='environment'||facing==='environment')?'none':'scaleX(-1)';
  vid.dataset.mirror=vid.style.transform!=='none'}
async function startCam(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){camFail('This view can’t open a live camera.');return}
  try{
    await openCam();$('#curtain').dataset.open='true';cue.textContent='';go.textContent='Take '+N+' photos';$('#flip').hidden=false;state('ready','Live');
  }catch(e){
    camFail(e.name==='NotAllowedError'||e.name==='SecurityError'?'Camera access is blocked here, so the live view can’t start.':'No camera was found.')}}
function camFail(t){
  msg.textContent=t+' Add your four photos one at a time with your phone’s front camera instead, or open the saved HTML file in your own browser for the live view.';
  go.hidden=true;pick.hidden=false;cue.textContent='Live camera unavailable.';state('off','Camera off')}
$('#flip').onclick=async()=>{if(busy)return;facing=facing==='user'?'environment':'user';try{await openCam()}catch(e){facing=facing==='user'?'environment':'user';try{await openCam()}catch(_){}}};

go.onclick=()=>stream?run():startCam();
function restyle(){if(busy)return;geo();reset();go.textContent=stream?'Take '+N+' photos':go.textContent}
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
  if(busy)return;const g=b.parentElement;
  if(b.dataset.n)N=+b.dataset.n;if(b.dataset.l)layout=b.dataset.l;if(b.dataset.p)paper=b.dataset.p;
  g.querySelectorAll('.opt').forEach(c=>c.setAttribute('aria-pressed',c===b));
  if((layout!=='grid'&&N===6)||(layout==='grid'&&N===3)){N=4;document.querySelectorAll('#optN .opt').forEach(c=>c.setAttribute('aria-pressed',c.dataset.n==='4'))}
  $('#n6').hidden=layout!=='grid';$('#n3').hidden=layout!=='strip';restyle()});
$('#new').onclick=()=>reset();
$('#uplIn').onchange=async e=>{
  const files=[...e.target.files];e.target.value='';if(!files.length||busy)return;
  if(idx>=N)reset();
  let bad=0;
  for(const f of files){
    if(idx>=N)break;
    try{const bm=await createImageBitmap(f);flash();shoot(bm,bm.width,bm.height,false)}catch(err){bad++}}
  msg.textContent=bad?'Some files couldn’t be read as photos and were skipped.':(idx<N?'Added '+idx+' of '+N+'. Upload or take more to fill the strip.':'');
  pick.firstChild.textContent='Add photo '+Math.min(idx+1,N)+' of '+N;
  if(idx===N)finish();else if(idx>0){strip.hidden=false;out.hidden=true}};
pick.querySelector('input').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f||busy)return;
  if(idx>=N)reset();
  try{const bm=await createImageBitmap(f);flash();shoot(bm,bm.width,bm.height,false)}
  catch(err){msg.textContent='That photo couldn’t be read. Try another one.';return}
  if(idx===N)finish();else pick.firstChild.textContent='Add photo '+(idx+1)+' of '+N};

function saveBlob(blob,name){
  if(dl)return dl.save({filename:name,data:blob}).catch(()=>{});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);return Promise.resolve()}
$('#save').onclick=()=>strip.toBlob(b=>{if(b)saveBlob(b,'safzcam-strip.png')},'image/png');

(async()=>{try{dl=window.claude?await claude.use('downloads'):null}catch(e){dl=null}})();
</script>
